name: Build 69LolOS ARM64 Chromium Desktop

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/arm64-chromium-desktop.yml"
      - "native-os/chromium-desktop/**"

permissions:
  contents: read

jobs:
  build-debian-arm64-desktop:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out 69LolOS
        uses: actions/checkout@v4

      - name: Install image tools
        run: |
          sudo apt-get update
          sudo apt-get install -y curl libguestfs-tools qemu-system-arm qemu-efi-aarch64 cloud-image-utils passt

      - name: Download Debian ARM64 cloud image
        run: |
          mkdir -p output
          curl --fail --location --retry 3 \
            https://cloud.debian.org/images/cloud/trixie/latest/debian-13-generic-arm64.qcow2 \
            --output output/69LolOS-Chromium-ARM64.qcow2
          qemu-img info output/69LolOS-Chromium-ARM64.qcow2

      - name: Prepare Debian first-boot desktop setup
        run: |
          cat > output/user-data <<'EOF'
          #cloud-config
          hostname: 69lolos
          manage_etc_hosts: true
          package_update: true
          package_upgrade: false
          packages:
            - xfce4
            - lightdm
            - chromium
            - dbus-x11
            - xserver-xorg
            - network-manager
            - ca-certificates
            - fonts-liberation
            - sudo
            - openssh-server
          users:
            - default
            - name: fraud
              gecos: 69LolOS User
              groups: [sudo, audio, video, plugdev, netdev]
              shell: /bin/bash
              lock_passwd: false
              passwd: "$6$rounds=4096$69LolOS$kz4bVh4rYxTQJ4g3wM2Nw2R9x1k0j1YwqQm5dJjX6pQv2nK1wF8tH0d3w5Z2fY5Q2hXqK1V9v7Q7s1wQ7k0"
          write_files:
            - path: /etc/lightdm/lightdm.conf.d/50-autologin.conf
              permissions: '0644'
              content: |
                [Seat:*]
                autologin-user=fraud
                autologin-user-timeout=0
            - path: /home/fraud/Desktop/Chromium.desktop
              owner: fraud:fraud
              permissions: '0755'
              content: |
                [Desktop Entry]
                Type=Application
                Name=Chromium Browser
                Exec=chromium --no-sandbox %U
                Terminal=false
                Categories=Network;WebBrowser;
          runcmd:
            - [systemctl, enable, lightdm]
            - [systemctl, enable, NetworkManager]
            - [systemctl, enable, ssh]
            - [chown, -R, fraud:fraud, /home/fraud]
            - [bash, -lc, "printf '\\n\\n# 69LolOS Chromium desktop image\\n' >> /etc/issue"]
          final_message: "69LolOS first-boot setup finished. XFCE and Chromium are installed."
          EOF
          cat > output/meta-data <<'EOF'
          instance-id: 69lolos-arm64-chromium
          local-hostname: 69lolos
          EOF
          cloud-localds output/69LolOS-Chromium-seed.iso output/user-data output/meta-data
          rm output/user-data output/meta-data

      - name: Prepare QEMU launch helper
        run: |
          cat > output/Run-69LolOS-Chromium-ARM64.sh <<'EOF'
          #!/usr/bin/env bash
          set -e
          HERE="$(cd -- "$(dirname -- "$0")" && pwd)"
          qemu-system-aarch64 \
            -machine virt -cpu cortex-a57 -m 4096 -smp 4 \
            -bios /usr/share/qemu-efi-aarch64/QEMU_EFI.fd \
            -drive if=none,file="$HERE/69LolOS-Chromium-ARM64.qcow2",format=qcow2,id=osdisk \
            -device virtio-blk-device,drive=osdisk \
            -device virtio-gpu-pci \
            -device qemu-xhci -device usb-kbd -device usb-tablet \
            -netdev user,id=net0 -device virtio-net-device,netdev=net0 \
            -display gtk
          EOF
          chmod +x output/Run-69LolOS-Chromium-ARM64.sh
          cat > output/README.txt <<'EOF'
          69LolOS ARM64 Chromium Desktop (QEMU)
          
          This is a separate Debian ARM64 cloud image. On first boot, cloud-init uses the
          attached seed ISO to install XFCE and Chromium; the first setup needs internet and
          may take several minutes. It does not replace the blue 69LolOS website or Buildroot image.
          
          Login user: fraud
          The first-boot cloud-init setup creates the user and configures desktop auto-login.
          Chromium and XFCE install on first boot; allow time for setup to finish.
          
          Linux host: install QEMU, cloud-init tools, and an ARM64 UEFI firmware package, then run:
            ./Run-69LolOS-Chromium-ARM64.sh
          
          The helper expects the QEMU AArch64 UEFI firmware at:
            /usr/share/qemu-efi-aarch64/QEMU_EFI.fd
          
          On Windows, install QEMU for Windows and use equivalent arguments from the helper;
          firmware paths differ by installation. Allocate at least 4 GB RAM if possible.
          
          This is a QEMU image, not a laptop installer. It has not been validated for the HP
          OmniBook Snapdragon hardware and must not be written to the laptop's internal drive.
          EOF
          qemu-img info output/69LolOS-Chromium-ARM64.qcow2

      - name: Upload Debian ARM64 Chromium desktop
        uses: actions/upload-artifact@v4
        with:
          name: 69LolOS-ARM64-Chromium-Desktop
          path: |
            output/69LolOS-Chromium-ARM64.qcow2
            output/69LolOS-Chromium-seed.iso
            output/Run-69LolOS-Chromium-ARM64.sh
            output/README.txt
          if-no-files-found: error
          retention-days: 14
