name: Build 69LolOS ARM64 Chromium Desktop

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/arm64-chromium-desktop.yml"
      - "native-os/chromium-desktop/**"

permissions:
  contents: read

jobs:
  build-debian-arm64-desktop:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out 69LolOS
        uses: actions/checkout@v4

      - name: Install image tools
        run: |
          sudo apt-get update
          sudo apt-get install -y curl libguestfs-tools qemu-system-arm qemu-efi-aarch64 cloud-image-utils

      - name: Download Debian ARM64 cloud image
        run: |
          mkdir -p output
          curl --fail --location --retry 3 \
            https://cloud.debian.org/images/cloud/trixie/latest/debian-13-generic-arm64.qcow2 \
            --output output/69LolOS-Chromium-ARM64.qcow2
          qemu-img info output/69LolOS-Chromium-ARM64.qcow2

      - name: Install desktop and Chromium into image
        env:
          LIBGUESTFS_BACKEND: direct
        run: |
          sudo virt-customize -a output/69LolOS-Chromium-ARM64.qcow2 \
            --update \
            --install "xfce4,lightdm,chromium,dbus-x11,xserver-xorg,network-manager,ca-certificates,fonts-liberation,sudo,openssh-server" \
            --run-command "id -u fraud >/dev/null 2>&1 || useradd -m -s /bin/bash fraud" \
            --run-command "echo 'fraud:69LolOS' | chpasswd" \
            --run-command "usermod -aG sudo fraud" \
            --run-command "mkdir -p /home/fraud/.config/autostart /home/fraud/Desktop" \
            --run-command "printf '[Desktop Entry]\\nType=Application\\nName=Chromium Browser\\nExec=chromium --no-sandbox %U\\nTerminal=false\\nCategories=Network;WebBrowser;\\n' > /home/fraud/Desktop/Chromium.desktop" \
            --run-command "chmod +x /home/fraud/Desktop/Chromium.desktop" \
            --run-command "printf '[Seat:*]\\nautologin-user=fraud\\nautologin-user-timeout=0\\n' > /etc/lightdm/lightdm.conf.d/50-autologin.conf" \
            --run-command "systemctl enable lightdm NetworkManager ssh" \
            --run-command "chown -R fraud:fraud /home/fraud" \
            --run-command "printf '\n\n# 69LolOS Chromium desktop image\n' >> /etc/issue"

      - name: Prepare QEMU launch helper
        run: |
          cat > output/Run-69LolOS-Chromium-ARM64.sh <<'EOF'
          #!/usr/bin/env bash
          set -e
          HERE="$(cd -- "$(dirname -- "$0")" && pwd)"
          qemu-system-aarch64 \
            -machine virt -cpu cortex-a57 -m 4096 -smp 4 \
            -bios /usr/share/qemu-efi-aarch64/QEMU_EFI.fd \
            -drive if=none,file="$HERE/69LolOS-Chromium-ARM64.qcow2",format=qcow2,id=osdisk \
            -device virtio-blk-device,drive=osdisk \
            -device virtio-gpu-pci \
            -device qemu-xhci -device usb-kbd -device usb-tablet \
            -netdev user,id=net0 -device virtio-net-device,netdev=net0 \
            -display gtk
          EOF
          chmod +x output/Run-69LolOS-Chromium-ARM64.sh
          cat > output/README.txt <<'EOF'
          69LolOS ARM64 Chromium Desktop (QEMU)
          
          This is a separate Debian ARM64 desktop image with XFCE and Chromium.
          It does not replace the existing blue 69LolOS website or the Buildroot console image.
          
          Login user: fraud
          Initial password: 69LolOS
          Change this password after first login.
          
          Linux host: install QEMU and an ARM64 UEFI firmware package, then run:
            ./Run-69LolOS-Chromium-ARM64.sh
          
          The helper expects the QEMU AArch64 UEFI firmware at:
            /usr/share/qemu-efi-aarch64/QEMU_EFI.fd
          
          On Windows, install QEMU for Windows and use equivalent arguments from the helper;
          firmware paths differ by installation. Allocate at least 4 GB RAM if possible.
          
          This is a QEMU image, not a laptop installer. It has not been validated for the HP
          OmniBook Snapdragon hardware and must not be written to the laptop's internal drive.
          EOF
          qemu-img info output/69LolOS-Chromium-ARM64.qcow2

      - name: Upload Debian ARM64 Chromium desktop
        uses: actions/upload-artifact@v4
        with:
          name: 69LolOS-ARM64-Chromium-Desktop
          path: |
            output/69LolOS-Chromium-ARM64.qcow2
            output/Run-69LolOS-Chromium-ARM64.sh
            output/README.txt
          if-no-files-found: error
          retention-days: 14
